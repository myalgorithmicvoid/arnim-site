backend:
  name: github
  repo: myalgorithmicvoid/arnim-site   # change this
  branch: main
media_folder: images/uploads
public_folder: images/uploads
collections:
  - name: site
    label: My site
    files:
      - name: content
        label: Edit site content
        file: content.json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - {label: First name, name: first, widget: string}
              - {label: Last name, name: last, widget: string}
              - {label: Tagline, name: tagline, widget: text}
          - label: Projects
            name: projects
            widget: list
            summary: "{{fields.title}}"
            fields:
              - {label: Title, name: title, widget: string}
              - {label: Description, name: description, widget: text}
              - {label: Tags, name: tags, widget: list, required: false, field: {label: Tag, name: tag, widget: string}}
              - {label: Show live LED matrix animation, name: led, widget: boolean, default: false, required: false}
          - label: Gallery
            name: gallery
            widget: list
            required: false
            summary: "{{fields.alt}}"
            fields:
              - {label: Photo, name: image, widget: image}
              - {label: Caption, name: alt, widget: string, required: false}
              
          - label: Contact
            name: contact
            widget: object
            fields:
              - {label: Text, name: text, widget: string}
          - label: Links
            name: links
            widget: list
            summary: "{{fields.label}}"
            fields:
              - {label: Name, name: label, widget: string}
              - {label: URL (https://... or mailto:...), name: url, widget: string}
          - {label: Footer text, name: footer, widget: string}
                    - label: Status panel
            name: status
            widget: object
            required: false
            fields:
              - {label: Status line, name: state, widget: string}
              - {label: Currently building, name: building, widget: string}

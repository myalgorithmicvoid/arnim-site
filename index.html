<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arnim Agarwal | Builder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#04070c;--panel:#09111a;--line:#123642;--cy:#22e5ff;--cy2:#0e8fa3;--tx:#d8f7fc;--mu:#7da6ae;
--d:'Chakra Petch','Segoe UI',sans-serif;--m:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:dark;scroll-behavior:smooth;scroll-padding-top:70px}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.65 var(--m);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
radial-gradient(500px circle at var(--x,70%) var(--y,10%),rgba(34,229,255,.16),transparent 70%),
linear-gradient(rgba(34,229,255,.05) 1px,transparent 1px) 0 0/44px 44px,
linear-gradient(90deg,rgba(34,229,255,.05) 1px,transparent 1px) 0 0/44px 44px}
a{color:var(--cy);text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:22px;align-items:center;padding:14px 5vw;background:rgba(4,7,12,.82);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);font-size:14px}
nav b{font:700 18px var(--d);color:var(--cy);margin-right:auto;text-shadow:0 0 12px rgba(34,229,255,.7)}
nav a{color:var(--mu)}nav a:hover{color:var(--cy)}
main{max-width:1040px;margin:0 auto;padding:0 5vw}
.hero{padding:12vh 0 10vh}
.term{display:inline-block;max-width:100%;border:1px solid var(--line);background:var(--panel);padding:10px 16px;border-radius:6px;color:var(--mu);font-size:14px;box-shadow:0 0 24px rgba(34,229,255,.08)}
.term i{color:var(--cy);font-style:normal}
.cur{display:inline-block;width:8px;height:15px;background:var(--cy);vertical-align:-2px;margin-left:3px;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
h1{font:700 clamp(46px,11vw,120px)/.95 var(--d);margin:28px 0 20px;letter-spacing:-.02em;text-shadow:0 0 18px rgba(34,229,255,.55),0 0 60px rgba(34,229,255,.25)}
h1 span{display:block;color:var(--cy)}
.lede{max-width:56ch;color:var(--mu);font-size:17px;margin:0 0 30px}
.btns{display:flex;gap:14px;flex-wrap:wrap}
.btn{font:500 15px var(--m);padding:12px 22px;border-radius:4px;border:1px solid var(--cy);color:var(--cy);background:transparent;transition:.2s}
.btn.p{background:var(--cy);color:#001418;box-shadow:0 0 22px rgba(34,229,255,.5)}
.btn:hover{box-shadow:0 0 26px rgba(34,229,255,.6);transform:translateY(-2px)}
h2{font:700 clamp(28px,5vw,40px)/1.1 var(--d);margin:0 0 28px}
h2::after{content:"";display:block;width:64px;height:3px;margin-top:12px;background:var(--cy);box-shadow:0 0 12px var(--cy)}
section{padding:7vh 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px;position:relative;transition:.25s}
.card:hover{border-color:var(--cy);box-shadow:0 0 30px rgba(34,229,255,.18)}
.card h3{font:700 22px var(--d);margin:0 0 8px}
.card p{margin:0 0 16px;color:var(--mu);font-size:15px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--cy2);color:var(--cy);padding:2px 9px;border-radius:3px;margin:0 6px 6px 0}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.gal figure{margin:0;position:relative;aspect-ratio:4/3;background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden;transition:.25s;cursor:zoom-in}
.gal figure:first-child{grid-column:span 2;aspect-ratio:auto;min-height:260px}
.gal figure::before,.gal figure::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--cy);z-index:2;pointer-events:none;filter:drop-shadow(0 0 5px var(--cy))}
.gal figure::before{top:8px;left:8px;border-right:0;border-bottom:0}
.gal figure::after{bottom:8px;right:8px;border-left:0;border-top:0}
.gal figure:hover{border-color:var(--cy);box-shadow:0 0 30px rgba(34,229,255,.25)}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.ph{height:100%;display:grid;place-items:center;color:var(--cy2);font-size:13px;background:repeating-linear-gradient(45deg,transparent 0 12px,rgba(34,229,255,.04) 12px 24px)}
#lb{position:fixed;inset:0;z-index:20;background:rgba(2,4,8,.94);display:none;place-items:center;padding:4vw;cursor:zoom-out}
#lb.on{display:grid}#lb img{max-width:100%;max-height:100%;border:1px solid var(--cy);box-shadow:0 0 50px rgba(34,229,255,.4)}
#led{display:block;width:160px;max-width:100%;aspect-ratio:1;margin:0 0 18px;background:#02050a;border:1px solid var(--line);border-radius:4px;box-shadow:0 0 24px rgba(34,229,255,.2)}
.cf{display:grid;gap:14px;max-width:560px;margin:0 0 32px}
.cf label{font-size:13px;color:var(--mu);display:grid;gap:6px}
.cf input,.cf textarea{width:100%;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:12px 14px;font:inherit;font-size:15px;outline:0;transition:.2s}
.cf input:focus,.cf textarea:focus{border-color:var(--cy);box-shadow:0 0 18px rgba(34,229,255,.25)}
.cf textarea{resize:vertical;min-height:120px}
.cf .hp{position:absolute;left:-9999px}
.cf button{justify-self:start;cursor:pointer}
#fs{min-height:22px;font-size:14px;color:var(--cy)}
footer{padding:50px 5vw 70px;text-align:center;color:var(--mu);font-size:13px;border-top:1px solid var(--line)}
@media(max-width:560px){nav a:not(.k){display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav><b>AA//</b><a href="#projects">projects</a><a href="#gallery" id="gnav">gallery</a><a href="#contact" class="k">contact</a></nav>
<main>
<header class="hero">
  <div class="term"><i>~/arnim</i> $ <span id="t"></span><span class="cur"></span></div>
  <h1><b id="n1" style="font:inherit"></b><span id="n2"></span></h1>
  <p class="lede" id="tag"></p>
  <div class="btns"><a class="btn p" href="#projects">See my projects</a><a class="btn" href="#contact">Contact me</a></div>
</header>

<section id="projects">
  <h2>Projects</h2>
  <div class="grid" id="pg"></div>
</section>

<section id="gallery" hidden>
  <h2>Gallery</h2>
  <div class="gal" id="gl"></div>
</section>

<section id="contact">
  <h2>Contact</h2>
  <p class="lede" id="ctext"></p>
  <form class="cf" id="cf" name="contact" method="POST" action="/" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="contact">
    <label class="hp" aria-hidden="true">Leave this empty <input name="bot-field" tabindex="-1" autocomplete="off"></label>
    <label>Name <input name="name" required maxlength="80" autocomplete="name"></label>
    <label>Email <input type="email" name="email" required maxlength="120" autocomplete="email"></label>
    <label>Message <textarea name="message" rows="5" required maxlength="2000"></textarea></label>
    <button class="btn p" type="submit">Send message</button>
    <div id="fs" role="status"></div>
  </form>
  <div class="btns" id="links"></div>
</section>
</main>
<div id="lb" role="dialog" aria-label="Image preview"></div>
<footer id="ft"></footer>
<script>
var s="whoami && ls projects",t=document.getElementById("t"),i=0,r=matchMedia("(prefers-reduced-motion:reduce)").matches,D={},cx;
if(r){t.textContent=s}else{(function k(){t.textContent=s.slice(0,++i);if(i<s.length)setTimeout(k,70+Math.random()*60)})()}
addEventListener("pointermove",function(e){document.body.style.setProperty("--x",e.clientX+"px");document.body.style.setProperty("--y",e.clientY+"px")});
function $(i){return document.getElementById(i)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function safe(u){return /^(https?:\/\/|mailto:|#)/i.test(u||"")?u:"#"}
function led(t){cx.clearRect(0,0,160,160);for(var y=0;y<16;y++)for(var x=0;x<16;x++){var v=Math.sin(x*.5+t)+Math.sin(y*.45-t*1.2)+Math.sin((x+y)*.3+t*.7);cx.fillStyle="hsl("+(185+v*28)+",100%,"+(30+(v+3)*9)+"%)";cx.beginPath();cx.arc(x*10+5,y*10+5,3.6,0,6.3);cx.fill()}}
function startLed(cv){cx=cv.getContext("2d");if(r){led(1)}else{(function f(ms){led(ms/700);requestAnimationFrame(f)})(0)}}
function init(d){D=d;var h=d.hero||{};
$("n1").textContent=h.first||"";$("n2").textContent=h.last||"";$("tag").textContent=h.tagline||"";
var pg=$("pg");pg.textContent="";
(d.projects||[]).forEach(function(p){var a=el("article","card"),c;
if(p.led){c=el("canvas");c.id="led";c.width=160;c.height=160;c.setAttribute("aria-label","Animated LED matrix");a.appendChild(c)}
a.appendChild(el("h3",0,p.title));a.appendChild(el("p",0,p.description));
(p.tags||[]).forEach(function(g){a.appendChild(el("span","tag",g))});pg.appendChild(a);if(c)startLed(c)});
var gl=$("gl"),G=d.gallery||[];gl.textContent="";
G.forEach(function(g){var f=el("figure"),m=el("img");m.src=g.image;m.alt=g.alt||"";m.loading="lazy";f.appendChild(m);gl.appendChild(f)});
$("gallery").hidden=!G.length;$("gnav").hidden=!G.length;
$("ctext").textContent=(d.contact||{}).text||"";
var lk=$("links");lk.textContent="";
(d.links||[]).forEach(function(l,n){var a=el("a","btn"+(n?"":" p"),l.label);a.href=safe(l.url);if(/^https?:/i.test(a.href)){a.target="_blank";a.rel="noopener"}lk.appendChild(a)});
$("ft").textContent=d.footer||""}
fetch("content.json",{cache:"no-store"}).then(function(x){return x.json()}).then(init).catch(function(){$("pg").textContent="Could not load content.json. Open this site through a web server or Netlify."});
var lb=$("lb");
document.addEventListener("click",function(e){var f=e.target.closest&&e.target.closest(".gal figure");if(!f)return;var i=f.querySelector("img");if(!i)return;lb.textContent="";var n=el("img");n.src=i.src;n.alt=i.alt;lb.appendChild(n);lb.classList.add("on")});
lb.onclick=function(){lb.classList.remove("on")};
addEventListener("keydown",function(e){if(e.key=="Escape")lb.classList.remove("on")});
$("cf").addEventListener("submit",function(e){e.preventDefault();var f=this,s=$("fs");s.textContent="Sending...";
fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(new FormData(f)).toString()})
.then(function(r){if(!r.ok)throw 0;f.reset();s.textContent="Message sent. Thanks, I'll get back to you!"})
.catch(function(){s.textContent="Could not send. Please try again or use the links below."})});
</script>
</body>
</html>
